# Объявление хуков для pre-commit (pre-commit.com).
#
# Зачем это здесь, а не копией сторожа в каждом репозитории: копия расходится
# при первой же правке правил, и заметить это нечем. Ровно та же причина, по
# которой проход CI живёт здесь, а не копируется, — только для хука.
#
# Репозиторий подключает сторожа четырьмя строками в .pre-commit-config.yaml
# и версией; см. README, раздел «Сторож до коммита».
- id: check-secrets
  name: сторож ключей
  description: Не пускает в коммит ключи, токены, огромные файлы и абсолютные пути.
  entry: hooks/check-secrets
  language: script
  # Сторож сам спрашивает у git, что подготовлено к коммиту: он умеет читать
  # имена через нулевой разделитель и не теряет кириллицу. Отдавать ему список
  # от pre-commit значит завести второй способ делать то же самое.
  pass_filenames: false
  always_run: true
