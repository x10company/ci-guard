# Сторож живёт здесь — и до 23.09.2026 здесь же не работал: self-check.yml
# зовёт его на себе в CI, а до коммита не проверялось ничего. Репозиторий
# единственный публичный в организации: ключ, попавший сюда, виден всем в тот
# же миг, когда уедет, и CI ловит его уже после этого.
#
# Берём себя же по МЕТКЕ, а не из рабочего дерева: барьер не должен зависеть
# от того, что им же чинят. Сломанная правка сторожа иначе отключала бы
# проверку ровно в тот коммит, которым её вносят.
default_install_hook_types: [pre-commit, pre-merge-commit]

repos:
  - repo: https://github.com/x10company/ci-guard
    rev: v1.0.3
    hooks:
      - id: check-secrets
