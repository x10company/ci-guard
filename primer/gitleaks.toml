# Настройка gitleaks для этого репозитория.
#
# Файл живёт в проекте, а не в ci-guard: исключения у каждого свои.
# Проверять после правок:
#   gitleaks detect --no-git --source . --config .gitleaks.toml

[extend]
useDefault = true

# generic-api-key НЕ отключать, хотя соблазн будет.
#
# Проверено подсадкой: настоящий PAT Airtable и токен Telegram gitleaks ловит
# ТОЛЬКО этой эвристикой — именных правил для них у него нет. Отключишь её —
# и он перестанет находить ровно то, ради чего поставлен.
#
# Шум от неё идёт из выгрузок данных, а не из кода. Глушить путями ниже.

[allowlist]
description = "Что не считаем находкой"

paths = [
  # Сюда — каталоги с выгрузками и дампами: данных много, ключей нет.
  # Разделитель пути пишите точкой: на Windows gitleaks отдаёт обратный слэш,
  # на Linux прямой, и жёсткий '/' молча не совпадёт.
  #
  # '''dannye.dampy''',
]

regexes = [
  # Заглушки в примерах и образцах.
  '''(?i)your[_-]?\w+''',
  '''(?i)xxx+|placeholder|example|sample|dummy|changeme''',
  # Идентификаторы объектов Airtable — адреса, а не ключи: без токена по ним
  # ничего не сделать. Правило airtable-api-key не отличает одно от другого.
  '''(?:app|tbl|viw|fld|rec|pgl|usr|wfl)[A-Za-z0-9]{14,17}''',
]
