name: проверка себя

# guard.yml рядом — это объявление переиспользуемого прохода, само по себе
# оно не запускается. Значит сторож проверял все репозитории организации,
# кроме того, в котором живёт. Этот файл зовёт его на себе.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    uses: ./.github/workflows/guard.yml
    with:
      # Кода на JS тут нет — только сторож на Python.
      proveryat-js: false
