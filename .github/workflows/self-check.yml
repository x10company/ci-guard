name: проверка себя

# guard.yml рядом — это объявление переиспользуемого прохода, само по себе
# оно не запускается. Значит сторож проверял все репозитории организации,
# кроме того, в котором живёт. Этот файл зовёт его на себе.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    uses: ./.github/workflows/guard.yml
    with:
      # Репозиторий-инструмент, не направление.
      napravlenie: false
      # Кода на JS тут нет — только сторож на Python.
      proveryat-js: false
      # Себя проверяем СВОИМ коммитом, а не выпущенной меткой: иначе правка
      # сторожа проверялась бы прошлой версией и до выпуска не проверялась
      # никогда.
      storozh-ref: ${{ github.sha }}
